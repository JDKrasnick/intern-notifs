name: Lever live contract
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:lever:live
      - run: npm run lever:reverify

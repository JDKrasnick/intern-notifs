name: Ashby live contract
on:
  schedule:
    - cron: '29 8 * * *'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  public-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:ashby:live
